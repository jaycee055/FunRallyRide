name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'privacy.html', 'icons/**', 'android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'rallyride-sideload' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install packages
        working-directory: android-app
        run: npm install
      - name: Prepare web files (libraries copied in for offline use)
        working-directory: android-app
        run: |
          mkdir -p www/lib
          cp ../index.html ../privacy.html www/
          cp -r ../icons www/
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css www/lib/
          for f in app auth database; do cp node_modules/firebase/firebase-$f-compat.js www/lib/; done
          sed -i 's#https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/#lib/#g' www/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/firebase@10.14.1/#lib/#g' www/index.html
          grep -q 'src="lib/maplibre-gl.js"' www/index.html
          grep -q 'src="lib/firebase-database-compat.js"' www/index.html
      - name: Add Android platform and permissions
        working-directory: android-app
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' $M
          grep -q RECORD_AUDIO $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: App icon and splash
        working-directory: android-app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2B8CEB' --splashBackgroundColor '#F4F7FB' --splashBackgroundColorDark '#0F1B2D'
      - name: Build
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          sed -i 's/networkTimeout=[0-9]*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon assembleRelease || (sleep 15 && ./gradlew --no-daemon assembleRelease)
      - name: Sign
        working-directory: android-app
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias rallyride --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out ../RallyRide.apk aligned.apk
          $BT/apksigner verify ../RallyRide.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: RallyRide for Android 1.0.${{ github.run_number }}
          make_latest: true
          files: RallyRide.apk
          body: |
            Download **RallyRide.apk** below and open it on your Android phone to install.
            (You may need to allow "Install unknown apps" for your browser the first time.)
